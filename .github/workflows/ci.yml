name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      - name: Test sharing fallbacks
        run: npm run test:share

      - name: Test safe return navigation
        run: npm run test:navigation

      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: local
      DEMO_MODE: "false"
      DATABASE_URL: postgresql+psycopg://festaflow_ci:ci-local-password@127.0.0.1:5432/festaflow
      JWT_SECRET: ci-only-jwt-secret-never-use-outside-ephemeral-tests
      KTO_API_KEY: ""
      CORS_ORIGINS: http://localhost:5173
      PYTHONUTF8: "1"
      TZ: Asia/Seoul

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: festaflow_ci
          POSTGRES_PASSWORD: ci-local-password
          POSTGRES_DB: festaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festaflow_ci -d festaflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Audit Python dependencies
        run: python -m pip_audit --local

      - name: Scan Python runtime code
        run: python -m bandit -r src/festaflow -q

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check models against migrations
        run: python -m alembic check

      - name: Run backend tests
        run: python -m pytest -q --junitxml=pytest-results.xml

      # The DB fixture intentionally skips when PostgreSQL is unavailable. Without this
      # guard, non-DB tests could keep pytest green while every DB test was skipped.
      - name: Reject skipped tests
        run: >-
          python -c "import xml.etree.ElementTree as ET;
          root = ET.parse('pytest-results.xml').getroot();
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite');
          skipped = sum(int(s.attrib.get('skipped', '0')) for s in suites);
          assert skipped == 0, f'{skipped} tests were skipped'"
