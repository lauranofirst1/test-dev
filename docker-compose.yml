# 배포용 — 서버 한 대에 DB · 백엔드 · 웹서버를 함께 올립니다.
#
# 개발은 여전히 `./dev.sh` 입니다. 이 파일은 서버에서만 씁니다.
#
#   cp .env.example .env   → .env 를 서버 값으로 채우고
#   docker compose up -d --build
#
# 필요한 값은 .env 의 POSTGRES_PASSWORD · JWT_SECRET · SITE_ADDRESS · KTO_API_KEY 입니다.

name: festaflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-festaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-festaflow}
      # 한글 정렬·검색이 걸리는 자리가 있어 인코딩을 못 박습니다.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 빈 데이터 디렉터리에 처음 뜰 때만 실행됩니다.
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-festaflow} -d ${POSTGRES_DB:-festaflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 밖으로 열지 않습니다. 같은 compose 망 안에서만 붙습니다.

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      # .env 의 localhost 주소가 컨테이너 안에서는 의미가 없습니다. 여기서 덮습니다.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-festaflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-festaflow}
      MEDIA_DIR: /app/media
      APP_ENV: production
      API_WORKERS: ${API_WORKERS:-4}
      # Caddy와 API가 같은 공개 도메인을 쓴다. SITE_ADDRESS는 docs/11-deploy.md의
      # 안내대로 scheme/path 없는 도메인이어야 한다.
      PUBLIC_WEB_ORIGIN: https://${SITE_ADDRESS}
      CORS_ORIGINS: https://${SITE_ADDRESS}
      # loopback 두 값은 컨테이너 내부 healthcheck 전용이다. API 포트는 외부에
      # publish하지 않으므로 인터넷 요청이 이 이름으로 직접 들어오지 않는다.
      TRUSTED_HOSTS: ${SITE_ADDRESS},localhost,127.0.0.1
      SESSION_COOKIE_SECURE: "true"
      DEMO_MODE: "false"
    volumes:
      # 업로드된 조각 보드 그림. 이 줄이 없으면 재배포마다 사라집니다.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      # 도메인이면 Caddy 가 인증서를 자동으로 받습니다.
      # 예: SITE_ADDRESS=festaflow.duckdns.org
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS 를 .env 에 정하세요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 받은 인증서를 여기 둡니다. 이 볼륨이 없으면 컨테이너를 다시 만들 때마다
      # 새로 발급받고, Let's Encrypt 의 발급 한도에 걸립니다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
